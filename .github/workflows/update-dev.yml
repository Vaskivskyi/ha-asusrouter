name: Bump AsusRouter from dev

on:
  repository_dispatch:
    types: [ar_dev_push]
  workflow_dispatch:

env:
  DEFAULT_PYTHON_VERSION: 3.14

permissions:
  contents: read

jobs:
  upgrade-asusrouter:
    runs-on: ubuntu-latest
    concurrency:
      group: upgrade-asusrouter
      cancel-in-progress: true
    env:
      ASUS_SHA: ${{ github.event.client_payload.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Upgrade asusrouter package in lockfile
        run: uv lock --upgrade-package asusrouter

      - name: Sync manifest requirement to the locked version
        run: |
          VERSION=$(grep -A1 '^name = "asusrouter"$' uv.lock | grep -oP 'version = "\K[^"]+')
          [ -n "$VERSION" ] || { echo "::error::asusrouter not found in uv.lock"; exit 1; }
          MANIFEST=custom_components/asusrouter/manifest.json
          jq --arg v "$VERSION" \
            '.requirements = [.requirements[] | if startswith("asusrouter") then "asusrouter==\($v)" else . end]' \
            "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.AR_APP_ID }}
          private-key: ${{ secrets.AR_APP_KEY }}

      - name: Create (update) Pull Request if changes
        id: create-pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          sign-commits: true
          commit-message: "🤖 Autoupdate: bump asusrouter @ ${{ env.ASUS_SHA }}"
          branch: "bot-ar-upgrade"
          add-paths: |
            uv.lock
            custom_components/asusrouter/manifest.json
          title: "Bump asusrouter to ${{ env.ASUS_SHA }}"
          body: |
            # 🤖 Automated update of asusrouter on the dev branch
            This PR was created automatically by a bot to keep the `asusrouter` dependency up to date
            for the development branch purposes. If the CI and actions pass successfully, it will be
            merged automatically.
          author: "asusrouter-bot <asusrouter-bot@users.noreply.github.com>"
          committer: "asusrouter-bot <asusrouter-bot@users.noreply.github.com>"
          labels: dependencies, bot
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3.0.0
        with:
          token: ${{ steps.app_token.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash
