repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args:
          - --branch=dev
          - --branch=main

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: readme
        name: build README
        entry: uv run python scripts/build_readme.py
        language: system
        files: ^(readme/|scripts/build_readme\.py$)
        pass_filenames: false
        stages: [pre-commit]
